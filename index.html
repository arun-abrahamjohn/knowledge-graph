<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technology · Power · Futures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0c09;
  --surface:#161410;
  --accent:#7a8e40;
  --gold:#c8a84a;
  --text:#e8dfc8;
  --mid:#908878;
  --border:#2a2518;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Bricolage Grotesque',sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:var(--sans);color:var(--text)}

/* BAR */
#bar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:46px;background:rgba(14,12,9,.96);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 16px;
  backdrop-filter:blur(8px);
}
#bar-title{font-family:var(--serif);font-size:13px;color:var(--mid);white-space:nowrap;font-style:italic}
.bar-btn{font-family:var(--sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid);background:none;border:1px solid var(--border);padding:5px 11px;cursor:pointer;border-radius:2px;transition:color .15s,border-color .15s;white-space:nowrap}
.bar-btn:hover{color:var(--text);border-color:var(--mid)}
.bar-btn.story-on{color:var(--accent);border-color:var(--accent)}
#search{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--text);font-family:var(--sans);font-size:10px;padding:4px 10px;border-radius:2px;outline:none;width:140px}
#search::placeholder{color:#555040}
#search:focus{border-color:var(--accent)}
#hint{font-family:var(--sans);font-size:9px;color:var(--mid);white-space:nowrap}

svg{width:100%;height:100%;cursor:grab;display:block}
svg:active{cursor:grabbing}
.node{cursor:pointer}
.node circle{transition:filter .18s}
.node:hover .main-c{filter:brightness(1.25)}
.edge{transition:opacity .2s,stroke .2s,stroke-width .2s}

/* STORY PANEL */
#sp{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:rgba(12,10,7,.98);border-top:1px solid var(--border);
  transform:translateY(100%);transition:transform .3s ease;
  backdrop-filter:blur(12px);
}
#sp.open{transform:translateY(0)}
#sp-inner{
  max-width:1100px;margin:0 auto;
  display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:0;min-height:160px;
}
.sp-arrow{
  display:flex;align-items:center;justify-content:center;
  width:60px;height:100%;cursor:pointer;
  color:#666050;font-size:24px;border:none;background:none;
  transition:color .15s;flex-shrink:0;align-self:stretch;
}
.sp-arrow:hover{color:var(--accent)}
.sp-arrow:disabled{opacity:.15;cursor:default}
#sp-content{padding:20px 10px;display:grid;grid-template-rows:auto auto 1fr;gap:6px}
#sp-meta{display:flex;align-items:center;gap:14px;margin-bottom:2px}
#sp-step{font-family:var(--sans);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--mid)}
#sp-track{flex:1;height:2px;background:var(--border);border-radius:1px;overflow:hidden}
#sp-fill{height:100%;background:var(--accent);border-radius:1px;transition:width .35s ease}
#sp-pct{font-family:var(--sans);font-size:9px;color:var(--mid);letter-spacing:.1em}
#sp-title{font-family:var(--serif);font-size:19px;font-weight:400;line-height:1.25;color:var(--text)}
#sp-body{font-size:14px;line-height:1.78;color:var(--mid);max-width:820px;font-weight:300}
#sp-top{position:absolute;top:10px;right:14px;display:flex;gap:8px}
.sp-sm-btn{font-family:var(--sans);font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--border);color:var(--mid);padding:3px 9px;cursor:pointer;border-radius:2px;transition:all .15s}
.sp-sm-btn:hover{color:var(--text);border-color:var(--mid)}
#sp-kb{position:absolute;bottom:10px;right:14px;font-family:var(--sans);font-size:8px;color:var(--mid);letter-spacing:.06em}

/* TOOLTIP */
#tip{position:fixed;z-index:400;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--surface);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:2px;font-size:11px;max-width:200px;line-height:1.5;font-family:var(--sans)}
#tip.show{opacity:1}

/* SKIP LINK */
.skip-link{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;z-index:1000;text-decoration:none}
.skip-link:focus{position:fixed;top:0;left:50%;transform:translateX(-50%);width:auto;height:auto;overflow:visible;background:var(--surface);color:var(--text);padding:8px 20px;border:1px solid var(--accent);border-radius:0 0 4px 4px;font-size:13px;font-family:var(--sans)}

/* FOCUS INDICATORS */
.bar-btn:focus-visible,.sp-arrow:focus-visible,.sp-sm-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.node:focus-visible circle.main-c{filter:brightness(1.4)}
#search:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

// Story - same as original but referenced here for completeness
const STORY=[
  {id:'root',title:'Tools we use are not completely subordinate to our will',body:'This is Heidegger\'s opening provocation - and the thesis the whole map argues. We assume technology does what we tell it. But the tools we use also shape us, constrain us, and quietly foreclose possibilities we never noticed we had lost.'},
  {id:'not_neutral',title:'Technology is not neutral',body:'Two views compete. The instrumental view says tech is just a tool - a hammer, a platform, a drug - and morality lies only in how you use it. The substantive view says tech itself shapes society, alters the environment, and carries values whether we intend it or not. Almost every serious thinker here holds the substantive view.'},
  {id:'enframing',title:'Enframing (Gestell): a disposition towards reality as standing reserve',body:'Heidegger\'s deepest concept. Enframing is not a technology - it is a way of seeing, a disposition towards reality. Under enframing, everything gets revealed as a resource waiting to be used, optimised, or extracted. It is not one choice among many - it becomes the only way of seeing.'},
  {id:'device_paradigm',title:'Device paradigm: hides machinery, delivers the commodity',body:'Albert Borgmann takes Heidegger\'s enframing into everyday life. The device paradigm is the pattern of modern technological culture: devices deliver a commodity - warmth, music, food, entertainment - while hiding the machinery that produces it.'},
  {id:'focal_practices',title:'Focal practices: require engagement, skill, attention - they gather people',body:'Focal practices are what the device paradigm dissolves. They are activities that require real engagement - tending a fire, cooking a meal from raw ingredients, playing an instrument, gardening. They are not replaceable by their outputs.'},
  {id:'pharmakon',title:'Technology as pharmakon: both poison and cure',body:'Bernard Stiegler extends the analysis into the mind. Technology is constitutive of what we are - we have always been cyborgs, always extending ourselves through tools. But it is a pharmakon: the same technology that extends the mind can also atrophy it.'},
  {id:'proletarian_mind',title:'Proletarianisation of the mind: skills encoded into tech',body:'Stiegler\'s sharpest concept. Industrial capitalism took knowledge from craftsmen and encoded it in machines. The same is happening to cognitive work. Our skills - writing, analysis, design, judgement - are being encoded into AI systems.'},
  {id:'contingent',title:'Technology is contingent - it could have been otherwise, and can be contested',body:'Andrew Feenberg offers the first genuinely hopeful claim. Technology is contingent - not necessary. It could have taken different forms. Because it is contingent, it can be challenged and redirected.'},
  {id:'inscription',title:'Inscription: translating the world into a mobile, readable format',body:'Bruno Latour observed scientists at work and noticed something crucial. Facts are not discovered - they are constructed through a process of inscription: translating the messy, resistant world into a readable, mobile format.'},
  {id:'black_boxing',title:'Black-boxing: so embedded that re-examining it is very costly',body:'Once a technology successfully stabilises, it becomes black-boxed. The choices embedded in it become invisible. The original controversies are forgotten. The political decisions look like technical facts.'},
  {id:'socially_constructed',title:'Technology is socially constructed - an achievement, not a discovery',body:'Bijker and Pinch make this concrete. Technologies do not arrive at their final form through engineering logic alone. They are shaped by social negotiation between groups with competing interests, interpretations, and values.'},
  {id:'hegemony',title:'Hegemony: the dominant group shapes the intellectual landscape as "common sense"',body:'Antonio Gramsci explains why the window tends to close before real contestation happens. The dominant group maintains power not primarily through force but by shaping what counts as common sense.'},
  {id:'social_imaginary',title:'Social imaginary: shared collective expectations of what is normal',body:'Charles Taylor locates the problem in what he calls the social imaginary: the shared, largely pre-theoretical understanding of what is normal, what is reasonable, what is possible.'},
  {id:'agonism',title:'Agonism: conflict is not a problem to solve - it defends against erasure',body:'Chantal Mouffe\'s core claim. Liberal political theory tries to manage conflict through rational consensus. Mouffe says this is both impossible and dangerous. Conflict is constitutive of the political.'},
  {id:'adversarial_design',title:'Adversarial design: surfaces conflict rather than resolving it',body:'DiSalvo\'s answer. Adversarial design does not try to solve problems - it tries to surface the conflict that problem-solving tends to bury.'},
  {id:'defuturing',title:'Defuturing: creating things that destroy the possibility of certain futures',body:'Tony Fry names the problem at its most fundamental level. Defuturing is the act of creating things that destroy the possibility of certain futures existing at all.'},
  {id:'foreclosed',title:'Foreclosed futures: what was possible but is no longer available',body:'Foreclosed futures are not simply futures that did not happen - they are futures that were possible, that were imagined, but were killed before they could arrive.'},
  {id:'futuring',title:'Futuring methods: forecast · backcast · recast · pastcast',body:'Roy Bendor\'s practical toolkit for working with time politically. Each method operates differently on the relationship between past, present, and future.'},
  {id:'democratic_imagination',title:'Democratic imagination: we should be involved in how we adopt tech',body:'Roy Bendor\'s central argument. Democratic life requires not just that we vote on representatives, but that we participate in the decisions that shape the material conditions of our lives - including which technologies we adopt.'},
  {id:'vsd',title:'Value Sensitive Design: accounting for human values throughout the design process',body:'Value Sensitive Design is a methodology that takes seriously the claim that technology is not neutral. Rather than treating values as constraints to satisfy after the design is done, VSD builds value investigation into every stage.'},
  {id:'rupture_window',title:'Window for contestation: the period of open rupture before stabilisation',body:'Before a technology stabilises - during the period of open rupture, when interpretive flexibility still exists - genuine contestation is possible. After black-boxing, contestation becomes very costly.'},
  {id:'design_agonism_q',title:'"How can design objects and practices work in support of agonistic pluralism?"',body:'This is DiSalvo\'s research question - and arguably the question that ties this entire map together. How do you make things that sustain conflict rather than suppress it?'},
];

// ── RENDER ──
const svg   = document.getElementById('svg');
const NS    = 'http://www.w3.org/2000/svg';
const tipEl = document.getElementById('tip');

let vx=0,vy=0,sc=0.26;
let dragging=false,lx=0,ly=0;
let focused=null, storyMode=false, storyIdx=0;

function mkEl(tag,attrs={}){
  const e=document.createElementNS(NS,tag);
  for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);
  return e;
}

const mainG=mkEl('g');svg.appendChild(mainG);
const edgeG=mkEl('g');mainG.appendChild(edgeG);
const nodeG=mkEl('g');mainG.appendChild(nodeG);

const nmap={};NODES.forEach(n=>nmap[n.id]=n);
const adj={};NODES.forEach(n=>adj[n.id]=new Set());
EDGES.forEach(e=>{adj[e.a].add(e.b);adj[e.b].add(e.a);});

const nodeEls={};

function setT(){
  const cx=window.innerWidth/2,cy=window.innerHeight/2;
  mainG.setAttribute('transform',`translate(${cx+vx*sc},${cy+vy*sc}) scale(${sc})`);
}

function drawEdges(){
  edgeG.innerHTML='';
  EDGES.forEach(e=>{
    const a=nmap[e.a],b=nmap[e.b];if(!a||!b)return;
    const cross=!!e.x;
    const mx=(a.x+b.x)/2+(cross?-(b.y-a.y)*.12:0);
    const my=(a.y+b.y)/2+(cross?(b.x-a.x)*.12:0);
    const el=mkEl('path',{
      class:'edge',fill:'none',
      d:`M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}`,
      stroke:cross?'#2a2010':'#3a3020',
      'stroke-width':cross?'1.5':'2.5',
      'stroke-dasharray':cross?'7 5':'none',
      opacity:cross?'0.3':'0.45',
      'data-a':e.a,'data-b':e.b,'data-cross':cross?'1':'0',
    });
    edgeG.appendChild(el);
  });
}

function drawNodes(){
  nodeG.innerHTML='';
  NODES.forEach(n=>{
    const r=TR[n.tier]||36;
    const fs=TF[n.tier]||9;
    const g=mkEl('g',{class:'node','data-id':n.id,tabindex:'0',role:'button','aria-label':n.label.replace(/\n/g,' ')});
    // glow
    g.appendChild(mkEl('circle',{cx:n.x,cy:n.y,r:r+14,fill:'none',stroke:n.color,opacity:'.06','stroke-width':'18'}));
    // main
    const c=mkEl('circle',{cx:n.x,cy:n.y,r:r,fill:n.color,class:'main-c',stroke:'rgba(255,255,255,0.05)','stroke-width':'1.5'});
    g.appendChild(c);
    // label
    const lines=n.label.split('\n');
    const lh=fs+4,tot=lines.length*lh;
    lines.forEach((line,i)=>{
      const t=mkEl('text',{
        x:n.x,y:n.y-tot/2+lh/2+i*lh,
        fill:n.tc||'#e8dfc8','font-size':n.tier===1?15:fs,
        'font-family':"'Bricolage Grotesque',sans-serif",
        'text-anchor':'middle','dominant-baseline':'middle',
        'font-weight':n.tier<=2?'500':'300',
        'font-style':n.label.startsWith('"')?'italic':'normal',
      });
      t.textContent=line;g.appendChild(t);
    });
    g.addEventListener('click',ev=>{ev.stopPropagation();if(!storyMode)focusNode(n.id);});
    g.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&!storyMode){ev.preventDefault();focusNode(n.id);}});
    g.addEventListener('mouseenter',ev=>{
      if(storyMode)return;
      tipEl.textContent=n.label.replace(/\n/g,' ');
      tipEl.classList.add('show');moveTip(ev);
    });
    g.addEventListener('mousemove',moveTip);
    g.addEventListener('mouseleave',()=>tipEl.classList.remove('show'));
    nodeG.appendChild(g);nodeEls[n.id]=g;
  });
}

function moveTip(e){
  let x=e.clientX+14,y=e.clientY+14;
  if(x+210>window.innerWidth)x=e.clientX-210;
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';
}

function focusNode(id){
  if(focused===id){resetFocus();return;}
  focused=id;
  const conn=adj[id];
  Object.entries(nodeEls).forEach(([nid,el])=>{
    if(nid===id){
      el.style.opacity='1';
      const c=el.querySelector('.main-c');
      c.setAttribute('stroke','rgba(200,168,74,.8)');
      c.setAttribute('stroke-width','3');
    } else if(conn.has(nid)){
      el.style.opacity='1';
    } else {
      el.style.opacity='0.06';
    }
  });
  document.querySelectorAll('.edge').forEach(el=>{
    const a=el.getAttribute('data-a'),b=el.getAttribute('data-b');
    const cross=el.getAttribute('data-cross')==='1';
    if(a===id||b===id){
      el.setAttribute('opacity','1');
      el.setAttribute('stroke',cross?'#c8a84a':'#e8d090');
      el.setAttribute('stroke-width',cross?'2':'3.5');
      el.setAttribute('stroke-dasharray',cross?'6 4':'none');
    } else {
      el.setAttribute('opacity','0.02');
    }
  });
}

function resetFocus(){
  focused=null;
  Object.entries(nodeEls).forEach(([,el])=>{
    el.style.opacity='1';
    const c=el.querySelector('.main-c');
    if(c){c.setAttribute('stroke','rgba(255,255,255,0.05)');c.setAttribute('stroke-width','1.5');}
  });
  document.querySelectorAll('.edge').forEach(el=>{
    const cross=el.getAttribute('data-cross')==='1';
    el.setAttribute('stroke',cross?'#2a2010':'#3a3020');
    el.setAttribute('stroke-width',cross?'1.5':'2.5');
    el.setAttribute('stroke-dasharray',cross?'7 5':'none');
    el.setAttribute('opacity',cross?'0.3':'0.45');
  });
}

// STORY
const sp    =document.getElementById('sp');
const spStep=document.getElementById('sp-step');
const spFill=document.getElementById('sp-fill');
const spPct =document.getElementById('sp-pct');
const spTitle=document.getElementById('sp-title');
const spBody =document.getElementById('sp-body');
const btnStory=document.getElementById('btn-story');

function panTo(id){
  const n=nmap[id];if(!n)return;
  const tx=-n.x,ty=-n.y;
  const svx=vx,svy=vy,t0=performance.now(),dur=500;
  function step(t){
    const p=Math.min((t-t0)/dur,1);
    const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    vx=svx+(tx-svx)*e;vy=svy+(ty-svy)*e;setT();
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function showStep(i){
  const s=STORY[i];
  spStep.textContent=`${i+1} / ${STORY.length}`;
  const pct=Math.round((i+1)/STORY.length*100);
  spFill.style.width=pct+'%';
  spPct.textContent=pct+'%';
  document.getElementById('sp-track').setAttribute('aria-valuenow',pct);
  spTitle.textContent=s.title;
  spBody.textContent=s.body;
  document.getElementById('btn-prev').disabled=(i===0);
  document.getElementById('btn-next').disabled=(i===STORY.length-1);
  focusNode(s.id);
  panTo(s.id);
}

function enterStory(){
  storyMode=true;storyIdx=0;
  sp.classList.add('open');
  sp.setAttribute('aria-hidden','false');
  btnStory.classList.add('story-on');
  btnStory.setAttribute('aria-expanded','true');
  btnStory.innerHTML='<span aria-hidden="true">■</span> Exit story';
  showStep(0);
}
function exitStory(){
  storyMode=false;
  sp.classList.remove('open');
  sp.setAttribute('aria-hidden','true');
  btnStory.classList.remove('story-on');
  btnStory.setAttribute('aria-expanded','false');
  btnStory.innerHTML='<span aria-hidden="true">▶</span> Story mode';
  resetFocus();
}

btnStory.addEventListener('click',()=>storyMode?exitStory():enterStory());
document.getElementById('btn-exit').addEventListener('click',exitStory);
document.getElementById('btn-next').addEventListener('click',()=>{if(storyIdx<STORY.length-1){storyIdx++;showStep(storyIdx);}});
document.getElementById('btn-prev').addEventListener('click',()=>{if(storyIdx>0){storyIdx--;showStep(storyIdx);}});

window.addEventListener('keydown',e=>{
  if(!storyMode)return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){if(storyIdx<STORY.length-1){storyIdx++;showStep(storyIdx);}}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(storyIdx>0){storyIdx--;showStep(storyIdx);}}
  if(e.key==='Escape')exitStory();
});

// PAN / ZOOM
svg.addEventListener('mousedown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  vx+=(e.clientX-lx)/sc;vy+=(e.clientY-ly)/sc;
  lx=e.clientX;ly=e.clientY;setT();
});
window.addEventListener('mouseup',()=>dragging=false);
svg.addEventListener('wheel',e=>{
  // Only zoom on explicit intent (ctrl/cmd + wheel, or pinch gesture).
  // Let regular scrolling pass through to the parent page.
  if(!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const d=e.deltaY>0?.88:1.14;
  const ns=Math.max(.1,Math.min(4,sc*d));
  const mx=e.clientX-window.innerWidth/2,my=e.clientY-window.innerHeight/2;
  vx=vx-mx/sc+mx/ns;vy=vy-my/sc+my/ns;
  sc=ns;setT();
},{passive:false});
svg.addEventListener('click',()=>{if(!storyMode)resetFocus();});

// TOUCH
let ltd=null;
svg.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}});
svg.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&dragging){vx+=(e.touches[0].clientX-lx)/sc;vy+=(e.touches[0].clientY-ly)/sc;lx=e.touches[0].clientX;ly=e.touches[0].clientY;setT();}
  else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,dist=Math.sqrt(dx*dx+dy*dy);if(ltd){sc=Math.max(.1,Math.min(4,sc*dist/ltd));setT();}ltd=dist;}
},{passive:false});
svg.addEventListener('touchend',()=>{dragging=false;ltd=null;});

// SEARCH
document.getElementById('search').addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  Object.entries(nodeEls).forEach(([nid,el])=>{
    el.style.opacity=!q||nmap[nid].label.toLowerCase().includes(q)?'1':'0.05';
  });
});
document.getElementById('btn-reset').addEventListener('click',()=>{
  resetFocus();document.getElementById('search').value='';
  Object.entries(nodeEls).forEach(([,el])=>el.style.opacity='1');
});

drawEdges();drawNodes();setT();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technology · Power · Futures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0}
:root{
  --bg:#0e0c09;
  --surface:#161410;
  --accent:#FF4500;
  --base:#EBEBE8;
  --ink:#1A1A1A;
  --text:#ebebe8;
  --mid:#948c80;
  --border:rgba(255,255,255,.12);
  --serif:'Inter',system-ui,sans-serif;
  --sans:'JetBrains Mono',ui-monospace,monospace;
}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:var(--sans);color:var(--text)}

/* BAR */
#bar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:46px;background:rgba(14,12,9,.96);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 16px;
  backdrop-filter:blur(8px);
}
#bar-title{
  font-family:var(--serif);font-size:12px;font-weight:900;letter-spacing:.04em;
  text-transform:uppercase;color:var(--text);white-space:nowrap;font-style:normal;
}
.bar-btn{
  font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(235,235,232,.9);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.2);
  padding:5px 11px;cursor:pointer;transition:color .15s,border-color .15s,background .15s;white-space:nowrap;
}
.bar-btn:hover{color:var(--base);border-color:rgba(255,69,0,.55);background:rgba(255,69,0,.12)}
.bar-btn.story-on{color:var(--base);border-color:var(--accent);background:rgba(255,69,0,.22)}
#search{
  margin-left:auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);
  color:var(--base);font-family:var(--sans);font-size:11px;padding:4px 10px;outline:none;width:170px;
}
#search::placeholder{color:var(--mid);opacity:.9}
#search:focus{border-color:var(--accent);background:rgba(255,69,0,.08)}
#hint{
  font-family:var(--sans);
  font-size:10px;
  font-weight:400;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--mid);
  white-space:nowrap;
}

svg{width:100%;height:100%;cursor:default;display:block}
svg:active{cursor:default}
.node{cursor:default}
.node circle{transition:filter .18s}
/* Enable interaction cursors only during the guided tour */
body.tour-active svg{cursor:grab}
body.tour-active svg:active{cursor:grabbing}
body.tour-active .node{cursor:pointer}
body.tour-active .node:hover .main-c{filter:brightness(1.25)}
.edge{transition:opacity .2s,stroke .2s,stroke-width .2s}

/* STORY PANEL */
#sp{
  position:fixed;bottom:0;left:0;right:0;z-index:300;
  background:rgba(12,10,7,.98);border-top:1px solid var(--border);
  transform:translateY(100%);transition:transform .3s ease;
  backdrop-filter:blur(12px);
}
#sp.open{transform:translateY(0)}
#sp-inner{
  max-width:1100px;margin:0 auto;
  display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:0;min-height:160px;
}
.sp-arrow{
  display:flex;align-items:center;justify-content:center;
  width:64px;height:100%;
  font-size:40px;line-height:1;font-weight:700;
  border:none;background:rgba(255,255,255,.07);cursor:pointer;
  color:#ece3cc !important;
  opacity:1 !important;
  flex-shrink:0;align-self:stretch;
  transition:color .15s,background .15s;
  -webkit-appearance:none;appearance:none;
}
.sp-arrow:hover:not(:disabled){color:#ffffff !important;background:rgba(255,255,255,.15)}
.sp-arrow:disabled{color:#5c5850 !important;opacity:1 !important;cursor:default;background:none;}
#sp-content{padding:20px 10px;display:grid;grid-template-rows:auto auto 1fr;gap:6px}
#sp-meta{display:flex;align-items:center;gap:14px;margin-bottom:2px}
#sp-step{font-family:var(--sans);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mid)}
#sp-track{flex:1;height:2px;background:rgba(255,255,255,.1);border-radius:1px;overflow:hidden}
#sp-fill{height:100%;background:var(--accent);border-radius:1px;transition:width .35s ease}
#sp-pct{font-family:var(--sans);font-size:10px;color:var(--mid);letter-spacing:.1em}
#sp-title{
  font-family:var(--serif);font-size:clamp(17px,2.2vw,22px);font-weight:600;line-height:1.12;
  letter-spacing:-.03em;color:var(--text);
}
#sp-body{font-family:var(--sans);font-size:14px;line-height:1.78;color:var(--mid);max-width:820px;font-weight:400}
#sp-top{position:absolute;top:10px;right:14px;display:flex;gap:8px}
.sp-sm-btn{
  font-family:var(--sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.2);color:rgba(235,235,232,.9);
  padding:3px 9px;cursor:pointer;transition:color .15s,border-color .15s,background .15s;
}
.sp-sm-btn:hover{color:var(--base);border-color:rgba(255,69,0,.55);background:rgba(255,69,0,.12)}
#sp-kb{position:absolute;bottom:10px;right:14px;font-family:var(--sans);font-size:9px;color:var(--mid);letter-spacing:.06em}

/* TOOLTIP */
#tip{
  position:fixed;z-index:400;pointer-events:none;
  opacity:0;transition:opacity .15s;
  background:rgba(14,12,9,.97);color:var(--text);
  border:1px solid var(--border);
  padding:10px 14px;border-radius:3px;
  font-family:var(--sans);font-size:12px;
  max-width:240px;line-height:1.6;
  backdrop-filter:blur(8px);
}
#tip.show{opacity:1}
#tip strong{display:block;font-family:var(--serif);font-weight:900;letter-spacing:-.03em;color:var(--base);margin-bottom:4px}
#tip span{color:var(--mid);font-weight:400;font-size:11px;line-height:1.55;display:block}
</style>
</head>
<body>

<div id="bar">
  <span id="bar-title">Technology · Power · Futures</span>
  <button class="bar-btn" id="btn-reset">Reset</button>
  <button class="bar-btn" id="btn-story">▶ Guided tour</button>
  <span id="hint">Start the guided tour to explore interactively</span>
  <input id="search" type="text" placeholder="search ideas…">
</div>

<svg id="svg"></svg>
<div id="tip"></div>

<div id="sp">
  <div id="sp-top">
    <button class="sp-sm-btn" id="btn-exit">Exit</button>
  </div>
  <div id="sp-inner">
    <button class="sp-arrow" id="btn-prev">&#10094;</button>
    <div id="sp-content">
      <div id="sp-meta">
        <span id="sp-step"></span>
        <div id="sp-track"><div id="sp-fill"></div></div>
        <span id="sp-pct"></span>
      </div>
      <div id="sp-title"></div>
      <div id="sp-body"></div>
    </div>
    <button class="sp-arrow" id="btn-next">&#10095;</button>
  </div>
  <div id="sp-kb">← → arrow keys to navigate</div>
</div>

  {id:'root',title:'Tools we use are not completely subordinate to our will',body:'This is Heidegger\'s opening provocation - and the thesis the whole map argues. We assume technology does what we tell it. But the tools we use also shape us, constrain us, and quietly foreclose possibilities we never noticed we had lost.'},
  {id:'not_neutral',title:'Technology is not neutral',body:'Two views compete. The instrumental view says tech is just a tool - a hammer, a platform, a drug - and morality lies only in how you use it. The substantive view says tech itself shapes society, alters the environment, and carries values whether we intend it or not. Almost every serious thinker here holds the substantive view.'},

  {id:'focal_practices',title:'Focal practices: require engagement, skill, attention - they gather people',body:'Focal practices are what the device paradigm dissolves. They are activities that require real engagement - tending a fire, cooking a meal from raw ingredients, playing an instrument, gardening. They are not replaceable by their outputs.'},

// ── 3D SPHERE DISTRIBUTION ──
// Each non-root node is placed on a sphere of radius SPHERE_R.
// We preserve the cluster's azimuthal direction (theta = atan2 of original 2D position)
// so cluster groupings remain spatially coherent, but randomise the latitude (phi)
// so nodes are spread across the full sphere rather than a flat plane.
// Root stays at (0,0,0) — invariant under Y-rotation, always at viewport centre.
const SPHERE_R   = 900;
const FOCAL      = 6000;
const DEPTH_RANGE = SPHERE_R;
const ROT_SPEED  = 0.004;

// Deterministic pseudo-random (seed → 0..1), no Math.random so layout is stable on reload
function _rnd(seed) {
  const s = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}

NODES.forEach((n, i) => {
  if (n.id === 'root') { n.x = 0; n.y = 0; n.z = 0; return; }
  // Azimuthal angle θ — preserves the cluster's original compass direction
  const theta = Math.atan2(n.y, n.x);
  // Polar angle φ — randomised for full-sphere spread, avoiding the poles
  const phi = Math.PI * 0.18 + _rnd(i + 5) * Math.PI * 0.64;
  n.x = SPHERE_R * Math.sin(phi) * Math.cos(theta);
  n.y = SPHERE_R * Math.cos(phi);
  n.z = SPHERE_R * Math.sin(phi) * Math.sin(theta);
});

// ── STATE ──
let rotY      = 0;
let autoRotate = true;
let focused   = null;
let storyMode = false, storyIdx = 0;

// Per-node opacity override: null = use depth-based, 1 = fully visible, 0..1 = dimmed
const nodeOpacity = {};
NODES.forEach(n => { nodeOpacity[n.id] = null; });

// Edge pairs to highlight (stored as "a|b" keys matching EDGES order)
const edgeHighlightSet = new Set();
// Story step: nodes that are visually highlighted (receive hover / tooltip)
const storyHighlightSet = new Set();

// ── MATH ──
function rotate3D(x, y, z) {
  // Pure Y-axis rotation — y is unchanged, x↔z exchange
  const x1 =  x * Math.cos(rotY) + z * Math.sin(rotY);
  const z1 = -x * Math.sin(rotY) + z * Math.cos(rotY);
  return { x: x1, y, z: z1 };
}

function project(x, y, z) {
  // Clamp denominator so nodes never blow up in scale as they cross z=0
  const s = FOCAL / Math.max(FOCAL * 0.5, FOCAL + z);
  return { sx: x * s, sy: y * s, scale: s, rz: z };
}

function getP(n) {
  const r = rotate3D(n.x, n.y, n.z);
  return project(r.x, r.y, r.z);
}

// Nodes rotating to back (rz > 0) fade out; front (rz < 0) stay bright
// At rest (rz=0) everything is fully visible
function depthAlpha(rz) {
  return Math.min(1, Math.max(0.12, 1 - (rz / DEPTH_RANGE) * 0.85));
}

// ── SVG / DOM SETUP ──
const svg   = document.getElementById('svg');
const NS    = 'http://www.w3.org/2000/svg';

let vx = 0, vy = 0, sc = 0.32;

function mkEl(tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

const mainG = mkEl('g'); svg.appendChild(mainG);
const edgeG = mkEl('g'); mainG.appendChild(edgeG);
const nodeG = mkEl('g'); mainG.appendChild(nodeG);

const nmap = {}; NODES.forEach(n => nmap[n.id] = n);
const adj  = {}; NODES.forEach(n => adj[n.id] = new Set());
EDGES.forEach(e => { adj[e.a].add(e.b); adj[e.b].add(e.a); });


// Canvas is below the 46px bar; in story mode the 160px panel also eats from the bottom
const BAR_H = 46;
const SP_H  = 160;
function getCenter() {
  const panelH = storyMode ? SP_H : 0;
  return {
    cx: window.innerWidth / 2,
    cy: BAR_H + (window.innerHeight - BAR_H - panelH) / 2,
  };
}
function setT() {
  const { cx, cy } = getCenter();
  mainG.setAttribute('transform', `translate(${cx + vx * sc},${cy + vy * sc}) scale(${sc})`);
}

// ── ELEMENT CACHE (created once on init, attributes updated each frame) ──
const STORY_MAP = {};
STORY.forEach(s => { STORY_MAP[s.id] = s; });

const tipEl = document.getElementById('tip');
let tipPointerX = 0, tipPointerY = 0;

// DOM is reordered every frame in draw(); mouseleave on nodes is unreliable. Keep tooltip in sync with what is actually under the pointer.
function syncStoryTooltipFromPoint(cx, cy) {
  if (!storyMode || !focused || !tipEl.classList.contains('show')) return;
  const el = document.elementFromPoint(cx, cy);
  const host = el && el.closest && el.closest('.node[data-id]');
  const id = host && host.getAttribute('data-id');
  if (!id || !storyHighlightSet.has(id)) tipEl.classList.remove('show');
}

// One <path> per edge — never recreated
const edgePaths = {};
EDGES.forEach(e => {
  const path = mkEl('path', { class: 'edge', fill: 'none' });
  edgeG.appendChild(path);
  edgePaths[e.a + '|' + e.b] = path;
});

// One <g> per node with glow, circle, and label texts — never recreated
const nodeCache = {};
NODES.forEach(n => {
  const g    = mkEl('g', { class: 'node', 'data-id': n.id });
  const glow = mkEl('circle');
  const circ = mkEl('circle', { class: 'main-c', fill: n.color });
  const labelLines = n.label.split('\n');
  const texts = labelLines.map(line => {
    const t = mkEl('text', {
      'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: n.tc || '#ebebe8',
      'font-family': "'JetBrains Mono',ui-monospace,monospace",
      'font-weight': n.tier <= 2 ? '500' : '400',
      'font-style': n.label.startsWith('"') ? 'italic' : 'normal',
      stroke: ['#0e0c09', '#1a1a1a'].includes((n.tc || '').toLowerCase())
        ? 'rgba(255,255,255,.28)' : 'rgba(0,0,0,.35)',
      'paint-order': 'stroke',
    });
    t.textContent = line;
    return t;
  });
  g.appendChild(glow); g.appendChild(circ);
  texts.forEach(t => g.appendChild(t));

  // Tooltip only on nodes highlighted for the current story step (not dimmed overlay nodes)
  g.addEventListener('mouseenter', () => {
    if (!storyMode || !focused || !storyHighlightSet.has(n.id)) return;
    const s = STORY_MAP[n.id];
    tipEl.innerHTML = s
      ? `<strong>${s.title}</strong><span>${s.body.length > 140 ? s.body.slice(0, 140) + '…' : s.body}</span>`
      : `<strong>${n.label.replace(/\n/g, ' ')}</strong>`;
    tipEl.classList.add('show');
  });
  g.addEventListener('mouseleave', () => tipEl.classList.remove('show'));

  nodeG.appendChild(g);
  nodeCache[n.id] = { g, glow, circ, texts, labelLines };
});

// ── DRAW (update cached element attributes each frame) ──
function draw() {
  // Compute all projections once per frame
  const proj = {};
  NODES.forEach(n => { proj[n.id] = getP(n); });

  // Update edges
  EDGES.forEach(e => {
    const key = e.a + '|' + e.b;
    const pa = proj[e.a], pb = proj[e.b];
    const cross = !!e.x, hl = edgeHighlightSet.has(key);
    const fade  = (depthAlpha(pa.rz) + depthAlpha(pb.rz)) / 2;
    let stroke, sw, opa, dash;
    if (hl) {
      stroke = cross ? '#ff7a4d' : '#FF4500'; sw = cross ? 2   : 3.5;
      dash   = cross ? '6 4'     : '0';       opa = Math.max(0.5, fade);
    } else {
      stroke = cross ? 'rgba(235,232,226,.32)' : 'rgba(235,232,226,.2)'; sw = cross ? 1.5 : 2.5;
      dash   = cross ? '7 5'     : '0';       opa = (cross ? 0.4 : 0.55) * fade * (focused ? 0.1 : 1);
    }
    const path = edgePaths[key];
    path.setAttribute('d', `M${pa.sx.toFixed(1)},${pa.sy.toFixed(1)} L${pb.sx.toFixed(1)},${pb.sy.toFixed(1)}`);
    path.setAttribute('stroke', stroke);
    path.setAttribute('stroke-width', sw);
    path.setAttribute('stroke-dasharray', dash);
    path.setAttribute('opacity', Math.max(0, opa).toFixed(3));
  });

  // Depth-sort nodes back-to-front and update their attributes
  NODES.slice().sort((a, b) => proj[a.id].rz - proj[b.id].rz).forEach(n => {
    const p = proj[n.id];
    const { g, glow, circ, texts, labelLines } = nodeCache[n.id];
    const baseR = TR[n.tier] || 36, baseFs = TF[n.tier] || 9;
    const r  = baseR * p.scale;
    const fs = Math.max(5, (n.tier === 1 ? 15 : baseFs) * p.scale);
    const da = depthAlpha(p.rz);
    const ov = nodeOpacity[n.id];
    const opa = (ov !== null && ov !== undefined) ? ov : da;
    const isFocused = n.id === focused;
    const storyHL = storyMode && focused && storyHighlightSet.has(n.id);
    const peStory = storyMode && focused ? (storyHL ? 'auto' : 'none') : 'auto';
    g.setAttribute('pointer-events', peStory);
    glow.setAttribute('pointer-events', 'none');
    circ.setAttribute('pointer-events', peStory);
    texts.forEach(t => t.setAttribute('pointer-events', peStory));

    glow.setAttribute('cx', p.sx.toFixed(1));   glow.setAttribute('cy', p.sy.toFixed(1));
    glow.setAttribute('r',  (r + 12 * p.scale).toFixed(1));
    glow.setAttribute('fill', 'none');           glow.setAttribute('stroke', n.color);
    glow.setAttribute('stroke-width', (16 * p.scale).toFixed(1));
    glow.setAttribute('opacity', (0.07 * da).toFixed(3));

    circ.setAttribute('cx', p.sx.toFixed(1));   circ.setAttribute('cy', p.sy.toFixed(1));
    circ.setAttribute('r',  r.toFixed(1));
    circ.setAttribute('stroke', isFocused ? '#FF4500' : 'rgba(255,255,255,0.06)');
    circ.setAttribute('stroke-width', ((isFocused ? 3 : 1.5) * p.scale).toFixed(2));
    circ.setAttribute('opacity', opa.toFixed(3));

    const lh = fs + 4, tot = labelLines.length * lh;
    texts.forEach((t, i) => {
      t.setAttribute('x', p.sx.toFixed(1));
      t.setAttribute('y', (p.sy - tot / 2 + lh / 2 + i * lh).toFixed(1));
      t.setAttribute('font-size', fs.toFixed(1));
      t.setAttribute('stroke-width', (1 * p.scale).toFixed(2));
      t.setAttribute('opacity', opa.toFixed(3));
    });

    nodeG.appendChild(g); // moves to end → correct depth order
  });
  if (storyMode && focused && tipEl.classList.contains('show')) {
    syncStoryTooltipFromPoint(tipPointerX, tipPointerY);
  }
}

// ── FIT VIEWPORT TO NODE + ITS NEIGHBOURS ──
// Simulates the final rotation, projects node + connected nodes,
// computes the bounding box, and returns sc/vx/vy to fill the viewport.
function computeFit(id) {
  const n = nmap[id]; if (!n) return null;

  // Rotation that brings this node to the front
  const targetY = Math.atan2(n.x, -n.z);
  let diff = targetY - rotY;
  diff = ((diff + Math.PI) % (2 * Math.PI)) - Math.PI;
  if (diff < -Math.PI) diff += 2 * Math.PI;

  // Temporarily apply final rotY to compute projected positions
  const savedY = rotY;
  rotY += diff;
  const conn = adj[id];
  const pts  = [n, ...[...conn].map(cid => nmap[cid]).filter(Boolean)].map(nd => getP(nd));
  rotY = savedY;

  const xs = pts.map(p => p.sx), ys = pts.map(p => p.sy);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const boxW = Math.max(maxX - minX, 1), boxH = Math.max(maxY - minY, 1);

  const PAD    = 80;
  const availW = window.innerWidth  - PAD * 2;
  const availH = window.innerHeight - BAR_H - SP_H - PAD * 2;
  const targetSc = Math.max(0.25, Math.min(2.5, Math.min(availW / boxW, availH / boxH)));

  return {
    diff,
    targetSc,
    targetVx: -((minX + maxX) / 2),
    targetVy: -((minY + maxY) / 2),
  };
}

function zoomToNode(id) {
  const fit = computeFit(id); if (!fit) return;
  const { diff, targetSc, targetVx, targetVy } = fit;
  const sY = rotY, sVx = vx, sVy = vy, sSc = sc;
  const t0 = performance.now(), dur = 750;
  (function step(t) {
    const p = Math.min((t - t0) / dur, 1);
    const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
    rotY = sY  + diff               * e;
    vx   = sVx + (targetVx - sVx)  * e;
    vy   = sVy + (targetVy - sVy)  * e;
    sc   = sSc + (targetSc - sSc)  * e;
    if (p < 1) requestAnimationFrame(step);
  })(performance.now());
}

function zoomOut() {
  const sSc = sc, sVx = vx, sVy = vy;
  const t0 = performance.now(), dur = 500;
  (function step(t) {
    const p = Math.min((t - t0) / dur, 1);
    const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
    sc = sSc + (0.32 - sSc) * e;
    vx = sVx * (1 - e);
    vy = sVy * (1 - e);
    if (p < 1) requestAnimationFrame(step);
  })(performance.now());
}

// ── FOCUS STATE ──
function focusNode(id) {
  focused = id;
  const conn = adj[id];
  edgeHighlightSet.clear();
  storyHighlightSet.clear();
  storyHighlightSet.add(id);
  conn.forEach(cid => storyHighlightSet.add(cid));
  NODES.forEach(n => { nodeOpacity[n.id] = (n.id === id || conn.has(n.id)) ? 1 : 0.08; });
  EDGES.forEach(e => { if (e.a === id || e.b === id) edgeHighlightSet.add(e.a + '|' + e.b); });
  zoomToNode(id);
}

function resetFocus() {
  focused = null; autoRotate = true;
  NODES.forEach(n => { nodeOpacity[n.id] = null; });
  edgeHighlightSet.clear();
  storyHighlightSet.clear();
  tipEl.classList.remove('show');
  zoomOut();
}

// ── ANIMATION LOOP ──
function animate() {
  if (autoRotate) rotY += ROT_SPEED;
  setT();
  draw();
  requestAnimationFrame(animate);
}

// ── STORY ──
const sp       = document.getElementById('sp');
const spStep   = document.getElementById('sp-step');
const spFill   = document.getElementById('sp-fill');
const spPct    = document.getElementById('sp-pct');
const spTitle  = document.getElementById('sp-title');
const spBody   = document.getElementById('sp-body');
const btnStory = document.getElementById('btn-story');

function showStep(i) {
  const s = STORY[i];
  spStep.textContent  = `${i + 1} / ${STORY.length}`;
  const pct = Math.round((i + 1) / STORY.length * 100);
  spFill.style.width  = pct + '%';
  spPct.textContent   = pct + '%';
  spTitle.textContent = s.title;
  spBody.textContent  = s.body;
  document.getElementById('btn-prev').disabled = (i === 0);
  document.getElementById('btn-next').disabled = (i === STORY.length - 1);
  focusNode(s.id);
}

function enterStory() {
  storyMode = true; storyIdx = 0; autoRotate = false;
  document.body.classList.add('tour-active');
  document.getElementById('hint').textContent = 'hover nodes · ← → navigate · esc=exit';
  sp.classList.add('open');
  btnStory.classList.add('story-on');
  btnStory.textContent = '■ Exit tour';
  showStep(0);
}

function exitStory() {
  storyMode = false;
  document.body.classList.remove('tour-active');
  document.getElementById('hint').textContent = 'Start the guided tour to explore interactively';
  sp.classList.remove('open');
  btnStory.classList.remove('story-on');
  btnStory.textContent = '▶ Guided tour';
  resetFocus();
}

btnStory.addEventListener('click', () => storyMode ? exitStory() : enterStory());
document.getElementById('btn-exit').addEventListener('click', exitStory);
document.getElementById('btn-next').addEventListener('click', () => {
  if (storyIdx < STORY.length - 1) { storyIdx++; showStep(storyIdx); }
});
document.getElementById('btn-prev').addEventListener('click', () => {
  if (storyIdx > 0) { storyIdx--; showStep(storyIdx); }
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (storyMode) exitStory(); return; }
  if (!storyMode) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (storyIdx < STORY.length - 1) { storyIdx++; showStep(storyIdx); }
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    if (storyIdx > 0) { storyIdx--; showStep(storyIdx); }
  }
});

// Tooltip position + hide when pointer leaves highlighted nodes (document: works over chrome and after SVG DOM reorder each frame)
document.addEventListener('mousemove', e => {
  tipPointerX = e.clientX;
  tipPointerY = e.clientY;
  if (!storyMode || !focused) return;
  syncStoryTooltipFromPoint(e.clientX, e.clientY);
  if (!tipEl.classList.contains('show')) return;
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + 260 > window.innerWidth)  x = e.clientX - 260;
  if (y + 160 > window.innerHeight) y = e.clientY - 160;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}, { passive: true });

// ── SEARCH ──
document.getElementById('search').addEventListener('input', function () {
  const q = this.value.toLowerCase().trim();
  NODES.forEach(n => { nodeOpacity[n.id] = !q ? null : (n.label.toLowerCase().includes(q) ? 1 : 0.06); });
});
document.getElementById('btn-reset').addEventListener('click', () => {
  resetFocus();
  document.getElementById('search').value = '';
});

setT();
animate();
</script>

</body>
